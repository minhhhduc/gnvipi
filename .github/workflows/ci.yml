name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
      - uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          install-mode: goinstall
          only-new-issues: true
          args: --timeout=5m

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
      - name: Run tests
        run: go test -race -vet=all ./...
        env:
          SKIP_INTEGRATION_TESTS: "1"

  test-postgres:
    name: Test (postgres)
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gnvipi
          POSTGRES_PASSWORD: gnvipi
          POSTGRES_DB: gnvipi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gnvipi -d gnvipi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GNVIPI_REQUIRE_DB_TESTS: "true"
      GNVIPI_TEST_DATABASE_URL: postgres://gnvipi:gnvipi@localhost:5432/gnvipi_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
      - name: Apply migrations
        run: go test -race -vet=all ./internal/db/...
      - name: Run full suite against PostgreSQL
        run: go test -race -vet=all ./...

  vulncheck:
    name: Vulncheck
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
      - uses: golang/govulncheck-action@v1
        with:
          go-version-input: "1.26.11"
          go-package: ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, test-postgres, vulncheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
      - name: Build
        run: go build -trimpath -ldflags="-s -w" ./cmd/serve

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/admin/.nvmrc
          cache: npm
          cache-dependency-path: web/admin/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
        working-directory: web/admin
      - name: Typecheck
        run: npm run typecheck
        working-directory: web/admin
      - name: Test
        run: npm run test
        working-directory: web/admin
      - name: Build
        run: npm run build
        working-directory: web/admin
      - name: Committed artifacts are current
        run: git diff --exit-code -- web/admin
      - name: Backend untouched
        run: git diff --exit-code -- '*.go'
