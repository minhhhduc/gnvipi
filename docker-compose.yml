services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      # Loopback only: the host needs it for scripts/run.ps1 readiness checks.
      - "127.0.0.1:${GNVIPI_DB_PORT:-5432}:5432"
    environment:
      # Dev-only defaults; override these for anything that is not a local
      # sandbox. Never commit a production password here.
      POSTGRES_USER: ${GNVIPI_DB_USER:-gnvipi_dev}
      POSTGRES_PASSWORD: ${GNVIPI_DB_PASSWORD:-gnvipi_dev_only}
      POSTGRES_DB: ${GNVIPI_DB_NAME:-gnvipi}
    volumes:
      - gnvipi_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  serve:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    image: gnvipi:local
    ports:
      # Host port is configurable so an existing gateway on :8080 is not
      # displaced; the container always listens on 8080.
      - "127.0.0.1:${GNVIPI_PORT:-8080}:8080"
    shm_size: "2gb"
    restart: unless-stopped
    command: ["-auto", "-addr", ":8080"]
    # Compose waits for PostgreSQL health but never runs migrations or owner
    # bootstrap automatically; run those CLI steps explicitly.
    depends_on:
      db:
        condition: service_healthy
    environment:
      CHROME_PROXY: ${CHROME_PROXY:-}
      # Dev-only DSN; the password lives only in the runtime environment (or
      # the ${GNVIPI_DB_PASSWORD} override above), never in the image.
      GNVIPI_DATABASE_URL: ${GNVIPI_DATABASE_URL:-postgres://gnvipi_dev:gnvipi_dev_only@db:5432/gnvipi?sslmode=disable}
      # Required when starting serve. Keep this empty by default so
      # `docker compose up -d db` does not require a serve-only secret.
      GNVIPI_MASTER_KEY: "${GNVIPI_MASTER_KEY:-}"
      GNVIPI_MASTER_KEY_VERSION: ${GNVIPI_MASTER_KEY_VERSION:-1}
      GNVIPI_DB_MAX_CONNS: ${GNVIPI_DB_MAX_CONNS:-10}
      # Development may reuse the runtime DSN; production requires a separate
      # DDL role through GNVIPI_MIGRATION_DATABASE_URL.
      # GNVIPI_MIGRATION_DATABASE_URL: ${GNVIPI_MIGRATION_DATABASE_URL:-}
      # Uncomment to enable /admin when publishing on non-loopback addresses.
      # GNVIPI_ADMIN_TOKEN: ${GNVIPI_ADMIN_TOKEN:-}

volumes:
  gnvipi_db:
