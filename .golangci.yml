version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - gocritic
    - nilerr
    - noctx
    - unconvert
    - unparam
    - misspell
    - usestdlibvars
    - errorlint
    - copyloopvar
  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
    misspell:
      locale: US
    errcheck:
      check-blank: true
  exclusions:
    rules:
      # Immutable row values are passed by value deliberately; pointer churn
      # would obscure ownership and expand the API diff.
      - path: internal[\\/](auth|providerstore)[\\/]
        text: "hugeParam|rangeValCopy"
        linters: [gocritic]

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

run:
  timeout: 5m